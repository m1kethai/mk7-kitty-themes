## name: Peaky Blinders
## author: Kitty Theme Wizard [https://chatg.pt/kittywizard]
## blurb: A sharp, industrial theme inspired by 1920s Birmingham. Expect dark soot, cold steel, the warm glow of whiskey, and the sudden flash of a "red right hand."

# ===== Color Palette ===== #

# Black:
#; Birmingham Soot | The thick, industrial smog that coats the city streets
color0 #181818
#; Tweed Cap | The rough, dark grey wool of the Shelby uniform
color8 #383838

# Red:
#; Red Right Hand | The dark, dried crimson of inevitable violence
color1 #8B1C1C
#; Furnace Fire | The intense heat of the BSA factories
color9 #B22222

# Green:
#; Billiard Table | The dim, felt green of the Garrison's back rooms
color2 #3A5239
#; Faded Emerald | The subdued tones of wealth trying to hide its origins
color10 #4F704D

# Yellow:
#; Irish Whiskey | The golden warmth of Arthur's favorite pour
color3 #B58D3D
#; Brass Pocket Watch | The glint of a Shelby timepiece in the dim light
color11 #D9AB4A

# Blue:
#; Cold Steel | The dull, menacing blue-grey of a Webley revolver
color4 #36454F
#; Birmingham Sky | The overcast, relentless chill of an English morning
color12 #506675

# Magenta:
#; Velvet Lapel | The deep, rich purple of Grace's upscale wardrobe
color5 #5D2E46
#; Spilled Wine | The bruised, wine-dark aftermath of a brawl
color13 #854064

# Cyan:
#; Cigarette Smoke | The thick, blue-tinged haze filling the betting shop
color6 #4A6363
#; Frosted Glass | The smeared, cool sheen of the Garrison pub windows
color14 #678686

# White:
#; Stiff Collar | The crisp, starched white of Tommy's tailored shirts
color7 #C4C4C4
