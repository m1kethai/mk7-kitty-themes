## name: Saltburn
## author: Kitty Theme Wizard [https://chatg.pt/kittywizard]
## blurb: A theme inspired by the decadent, sun-drenched, and ultimately dark world of "Saltburn." It blends opulent golds and lush estate greens with the neon hues of a midsummer night's descent into madness.

# ===== Color Palette ===== #

# Black:
#; Estate Shadows | The dark, dusty corners of an ancient, sprawling manor
color0 #1A1514
#; Tuxedo Velvet | The worn but expensive fabric of formal evening wear
color8 #3C302E

# Red:
#; Vampiric Wine | The deep crimson of vintage wine and consuming obsession
color1 #8C1D1D
#; Spilled Blood | The stark, violent reality hidden beneath the glamour
color9 #B92B27

# Green:
#; The Hedge Maze | The towering, claustrophobic greenery of the estate grounds
color2 #3B5E3C
#; Sunlit Lawn | The vibrant, sprawling grass perfect for careless lounging
color10 #5C8A53

# Yellow:
#; Old Money Gold | The tarnished, inherited wealth adorning the walls and frames
color3 #C79F3E
#; Summer Haze | The blinding, sweaty heat of an English summer afternoon
color11 #E6C25B

# Blue:
#; Deep Pool | The cool, inviting, yet dangerous waters of the estate pool
color4 #2A5A78
#; Oxford Sky | The crisp, fleeting innocence of early university days
color12 #4B86A6

# Magenta:
#; Midsummer Neon | The chaotic, fluorescent pulse of the late-night costume party
color5 #8A2E61
#; Toxic Desire | The blinding, dizzying allure of belonging to the elite
color13 #B84D87

# Cyan:
#; Morning Mist | The damp chill hanging over the estate at dawn
color6 #3E8284
#; Porcelain Reflection | The cool sheen of antique bathroom fixtures
color14 #62B1B4

# White:
#; Tennis Whites | The crisp, privileged leisure wear of the upper class
color7 #D6D2C4
#; Marble Bust | The pale, unblinking statues watching over the chaos
color15 #F5F2E6

