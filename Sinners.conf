## name: Sinners
## author: Kitty Theme Wizard [https://chatg.pt/kittywizard]
## blurb: A Southern Gothic horror theme inspired by the 2025 film "Sinners." Dark bayous, eerie twilights, lantern light, and the unmistakable crimson of a blood-soaked curse.

# ===== Color Palette ===== #

# Black:
#; Bayou Midnight | The oppressive, suffocating darkness of the deep woods
color0 #141614
#; Worn Leather | The scuffed, aged material of period boots and saddles
color8 #2E302E

# Red:
#; Vampire's Thirst | The deep, dark crimson of ancient bloodlines
color1 #8F1A1A
#; Fresh Spatter | The shocking, vibrant red of newfound violence
color9 #C42626

# Green:
#; Hanging Moss | The draping, eerie greenery of the Southern swamplands
color2 #3A543C
#; Toxic Slough | The murky, stagnant waters hiding deadly secrets
color10 #547A57

# Yellow:
#; Kerosene Glow | The weak, flickering light of a lone lantern
color3 #B88E3E
#; Harvest Moon | The pale, ominous lunar glow breaking through the trees
color11 #DEC26D

# Blue:
#; Midnight River | The cold, dark currents pulling everything under
color4 #284457
#; Twilight Apparition | The haunting, supernatural blue of the witching hour
color12 #46708A

# Magenta:
#; Cursed Bloodline | The bruised, mystical purple of dark magic and old veins
color5 #612D51
#; Ritual Ash | The lingering, dusty violet of a completed summoning
color13 #8A4676

# Cyan:
#; Swamp Fog | The thick, chilling mist that rolls in after dark
color6 #396361
#; Ghost Light | The deceptive, unnatural luminescence in the deep marsh
color14 #5B8C8A

# White:
#; Sun-Bleached Bone | The stark, pale remnants of what was left behind
color7 #C9C7BD
#; Frightened Pale | The terrified, bloodless complexion of the hunted
color15 #EBE8DE

